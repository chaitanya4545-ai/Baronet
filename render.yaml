services:
  - type: web
    name: baronet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: LOG_LEVEL
        value: INFO
      - key: WORKSPACE_PATH
        value: ./workspace
      - key: GROQ_API_KEY
        sync: false
